# Services-only compose for Apple Silicon (macOS).
# PyTorch runs natively with MPS — do not containerise it here.
# Start with: docker compose up -d

services:
  qdrant:
    image: qdrant/qdrant:v1.12.5
    ports:
      - "6333:6333"   # REST API
      - "6334:6334"   # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
