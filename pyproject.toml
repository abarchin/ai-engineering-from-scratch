[project]
name = "ai-engineering-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Alvaro Barchin", email = "alvarobarchin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5",
    "matplotlib>=3.11",
    "pandas>=3.0",
    "scikit-learn>=1.9",
    "scipy>=1.18",
    "jupyter>=1.1",
    "jupyterlab>=4.6",
    "ipywidgets>=8.1",
    "requests>=2.34",
    "pillow>=12.3",
    "psutil>=7.2",
    "datasets>=5.0.1",
    "huggingface-hub>=1.27.0",
]

[project.optional-dependencies]
mps = [
    "torch>=2.13",
    "torchvision>=0.28",
    "torchaudio>=2.11",
]
cuda = [
    "torch>=2.13",
    "torchvision>=0.28",
    "torchaudio>=2.11",
]

[project.scripts]
ai-engineering-from-scratch = "ai_engineering_from_scratch:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
